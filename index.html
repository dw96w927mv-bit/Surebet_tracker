function optimizeStakes(type,odds,free,already,budget,roundTo,caps){
 const n=type==='3way'?3:2,u=Math.max(.01,roundTo),money=E.money;

 const maxBudgetUnits=Math.max(0,Math.floor((budget+1e-8)/u));

 const upper=Math.min(...bases.map((b,i)=>b+odds[i]*capUnits[i]*u));
 let lo=Math.min(...bases),hi=upper;
 if(payAt(hi)>maxBudgetUnits*u+1e-8){for(let i=0;i<60;i++){const mid=(lo+hi)/2;if(payAt(mid)>maxBudgetUnits*u)hi=mid;else lo=mid}}else lo=hi;
 const target=lo;
 const valid=[],seen=new Set();

  if(units.some((x,i)=>x<0||x>capUnits[i])||units.reduce((a,b)=>a+b,0)>maxBudgetUnits)return;

 for(const offset of [-3,-2,-1,0,1,2,3])levels.push(target+offset*u*Math.min(...odds));
 for(let t of levels){

 for(const cand of valid.slice(1)){
  if(alternatives.length>=3)break;
  const dist=cand.add.reduce((s,x,i)=>s+Math.abs(x-best.add[i]),0);
  if(dist<=Math.max(u*6,0.01)&&!alternatives.some(a=>a.add.every((v,i)=>v===cand.add[i])))alternatives.push(cand);
 }
 return {...best,alternatives,roundTo:u,appliedCaps:capUnits.map(v=>money(v*u)),budget:money(maxBudgetUnits*u)};
}
function recalc(){
 const ty=document.getElementById('calc-type');if(!ty)return;
 const type=ty.value,third=type==='3way',thirdRow=document.querySelector('[data-legrow="2"]');if(thirdRow)thirdRow.style.display=third?'grid':'none';
 const get=(col,i)=>num(document.querySelector(`[data-col="${col}"][data-i="${i}"]`)?.value);
 const budgetRaw=document.getElementById('calc-budget').value,budget=num(budgetRaw),unit=num(document.getElementById('calc-round').value);
 const n=third?3:2,odds=[...Array(n)].map((_,i)=>get('odd',i)),free=[...Array(n)].map((_,i)=>get('free',i)),already=[...Array(n)].map((_,i)=>get('own',i));
 const caps=[...Array(n)].map((_,i)=>{const s=document.querySelector(`[data-col="max"][data-i="${i}"]`).value.trim();return s===''?budget:num(s)});
 const r=optimizeStakes(type,odds,free,already,budget,unit,caps);
 const dest=document.getElementById('calc-result');if(!dest)return;
 if(!r){dest.innerHTML='<div class="banner warn">Vul geldige odds groter dan 1 en niet-negatieve bedragen in.</div>';return;}
 const details=way=>`<tr><td>Beste verdeling</td>${way.add.map(v=>`<td class="right">${euro(v)}</td>`).join('')}${Array.from({length:3-n},()=>'<td class="right">—</td>').join('')}<td class="right ${currencyClass(way.minProfit)}"><b>${euro(way.minProfit)}</b></td></tr>`;
 const altRows=r.alternatives.map((a,i)=>`<tr><td>Alternatief ${i+1}</td>${a.add.map(v=>`<td class="right">${euro(v)}</td>`).join('')}${Array.from({length:3-n},()=>'<td class="right">—</td>').join('')}<td class="right ${currencyClass(a.minProfit)}">${euro(a.minProfit)}</td></tr>`).join('');
 const noExtra=r.extraOwn===0&&free.every(x=>x===0)&&already.every(x=>x===0);
 dest.innerHTML=`<div class="grid">${metric('Minimale winst',euro(r.minProfit),'Bij voorgestelde verdeling',currencyClass(r.minProfit))}${metric('Extra eigen inzet',euro(r.extraOwn),'Binnen de limieten')}${metric('Eigen inzet totaal',euro(r.totalOwn),'Inclusief reeds geplaatst')}${metric('Nog vrij budget',euro(Math.max(0,budget-r.extraOwn)),'Niet extra ingezet')}</div><div class="sectionhead"><h3>Beste inzetverdeling</h3></div><div class="tablebox"><table><thead><tr><th>Uitkomst</th><th class="right">Extra inzet</th><th class="right">Netto resultaat als deze wint</th></tr></thead><tbody>${r.add.map((x,i)=>`<tr><td>Bet ${i+1}${caps[i]<budget?' (limiet)':''}</td><td class="right"><b>${euro(x)}</b></td><td class="right ${currencyClass(r.profitByOutcome[i])}">${euro(r.profitByOutcome[i])}</td></tr>`).join('')}</tbody></table></div><div class="sectionhead"><h3>Inzetten vlakbij het advies</h3></div>${r.alternatives.length?`<div class="tablebox"><table><thead><tr><th>Verdeling</th><th class="right">Bet 1</th><th class="right">Bet 2</th><th class="right">Bet 3</th><th class="right">Minimale winst</th></tr></thead><tbody>${details(r)}${altRows}</tbody></table></div>`:'<p class="helper">Geen andere geldige nabijgelegen verdeling binnen je limieten gevonden.</p>'}<p class="helper" style="margin-top:13px">${noExtra?'Met deze quoteringen is binnen het budget geen gegarandeerd winstgevende eigen-geld-inzet gevonden. De beste keuze op winstgarantie is dan geen extra inzet.':r.minProfit<0?'Let op: zelfs de beste verdeling volgens dit model kan verlies opleveren.':r.minProfit===0?'Met deze limieten is geen positieve minimale winst te bereiken; overweeg of je de freebet wilt inzetten.':'De verdeling is berekend op maximale minimale winst.'} Alle bedragen zijn na afronding doorgerekend. Controleer odds, bookmakerlimieten en uitslagvoorwaarden vóór inzet.</p>`;
}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" class="fieldinput" name="${name}" type="${type}" ${type==='text'?'inputmode="'+(['event','note','name'].includes(name)?'text':'decimal')+'"':''} value="${esc(value??'')}" ${extra}></div>`}
function formSelect(label,name,values,current){return `<div class="field"><label>${label}</label><select class="fieldinput" name="${name}">${opts(values,current)}</select></div>`}
function modal(title,html,onSaveLabel='Opslaan'){overlay.innerHTML=`<div class="modal-overlay" id="modal-overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-header"><h2>${esc(title)}</h2><button type="button" class="btn small subtle" data-action="close-modal">Sluiten ✕</button></div><div class="modal-body">${html}</div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Annuleren</button><button type="submit" form="entry-form" class="btn primary">${esc(onSaveLabel)}</button></div></section></div>`;}
function openBet(b){
 const edit=!!b;
 b=b||{date:today(),event:'',type:'2way',winner:'open',settledDate:'',legs:[{book:E.allBooks(data)[0]||'',odd:'',stake:'',freebet:0},{book:E.allBooks(data)[1]||E.allBooks(data)[0]||'',odd:'',stake:'',freebet:0},{book:'',odd:'',stake:'',freebet:0}]};
 const books=E.allBooks(data);
 if(!books.length){alert('Voeg eerst een bookmaker toe in Portefeuille. Daarna kun je je bet invoeren.');goto('portfolio');return;}
 const content=`<form id="entry-form" data-kind="bet" data-id="${esc(b.id||'')}" class="bet-entry-form">
 <section class="bet-entry-section"><h3>1. Wedstrijd</h3><div class="formgrid">${field('Datum','date',b.date,'date','required')}${formSelect('Type weddenschap','type',['2way','3way','2plus3'],b.type)}<div class="span2">${field('Wedstrijd of omschrijving','event',b.event,'text','required placeholder="Bijv. Ajax – PSV"')}</div></div></section>
 <section class="bet-entry-section"><div class="entry-section-heading"><h3>2. Inzetten</h3><span class="small muted">Freebet per bookmaker mogelijk</span></div>
 ${[0,1,2].map(i=>`<div class="legfield" ${i===2?'id="third-leg"':''}><div class="entry-section-heading"><h3>Bet ${i+1}</h3><span id="leg-own-${i}" class="leg-own">Eigen inzet —</span></div><div class="formgrid">${legInputs(i,b.legs[i],books)}</div></div>`).join('')}
 <p class="helper">Vul bij elke bet de volledige inzet in. Is deze helemaal gratis? Zet dan hetzelfde bedrag bij <b>Freebet</b>. Je eigen inzet wordt automatisch € 0.</p></section>
 <section class="bet-entry-section"><h3>3. Controle vóór opslaan</h3><div class="bet-live-summary" id="bet-live-summary" aria-live="polite">Vul de odds en inzetten in om de verwachte winst te zien.</div></section>
 <details class="bet-result-details" ${b.winner!=='open'?'open':''}><summary>4. Uitslag invullen <span class="muted small">(optioneel, kan later)</span></summary><div class="formgrid" style="padding-top:13px">${formSelect('Gewonnen uitkomst','winner',['open','1','2','3','23'],b.winner)}${field('Afrekendatum','settledDate',b.settledDate||'','date')}</div><p class="helper" style="margin-top:8px">Laat op <b>Open</b> staan als de wedstrijd nog loopt. Na afloop kun je de bet bewerken of op ‘Uitslag’ tikken.</p></details>
 <p class="form-error" id="form-error" role="alert"></p></form>`;
 modal(edit?'Bet bewerken':'Nieuwe bet toevoegen',content,edit?'Wijzigingen opslaan':'Bet opslaan');
 if(edit)insertDelete();
 fixWinOptions();updateBetPreview();
}
function legInputs(i,l,books){l=l||{book:books[0]||'',odd:'',stake:'',freebet:0};return `<div class="span2">${formSelect('Bookmaker','book'+i,books,l.book)}</div>${field('Odd','odd'+i,l.odd,'text','required placeholder="Bijv. 2,85"')}${field('Totale inzet (€)','stake'+i,l.stake,'text','required placeholder="Bijv. 50"')}<div class="span2">${field('Waarvan freebet (€)','free'+i,l.freebet,'text','placeholder="0"')}</div>`}
function fixWinOptions(){
 const f=document.getElementById('entry-form');if(!f||f.dataset.kind!=='bet')return;
 const type=f.elements.type.value;
 const third=document.getElementById('third-leg');
 third.classList.toggle('hidden',type==='2way');
 third.querySelectorAll('input,select').forEach(control=>control.disabled=type==='2way');
 const sel=f.elements.winner,cur=sel.value;
 const allowed=type==='2way'?['open','1','2']:type==='3way'?['open','1','2','3']:['open','1','23'];
 for(const o of sel.options){o.hidden=!allowed.includes(o.value);o.disabled=o.hidden;}
 if(!allowed.includes(cur))sel.value='open';
 updateBetPreview();
}
function updateBetPreview(){
 const f=document.getElementById('entry-form');if(!f||f.dataset.kind!=='bet')return;
 const type=f.elements.type.value,count=type==='2way'?2:3;
 const legs=[...Array(count)].map((_,i)=>({book:f.elements['book'+i].value,odd:num(f.elements['odd'+i].value),stake:num(f.elements['stake'+i].value),freebet:num(f.elements['free'+i].value)}));
 for(let i=0;i<3;i++){
  const label=document.getElementById('leg-own-'+i);
  if(label)label.textContent=i<count?'Eigen inzet '+euro(E.own(legs[i])):'Eigen inzet —';
 }
 const panel=document.getElementById('bet-live-summary');if(!panel)return;
 const good=legs.every(l=>l.book&&l.odd>1&&l.stake>0&&l.freebet>=0&&l.freebet<=l.stake);
 if(!good){panel.innerHTML='<span class="muted">Vul voor alle actieve bets bookmaker, odd en totale inzet in. Freebet mag niet hoger zijn dan de inzet.</span>';return;}
 const b={type,legs,winner:f.elements.winner.value};
 const own=E.totalOwn(b),free=E.money(legs.reduce((s,l)=>s+l.freebet,0)),expected=E.expectedMin(b),actual=E.profit(b);
 panel.innerHTML=`<div class="bet-summary-stats"><div><span>Eigen geld</span><strong>${euro(own)}</strong></div><div><span>Gebruikte freebets</span><strong>${euro(free)}</strong></div><div><span>Minimumwinst</span><strong class="${currencyClass(expected)}">${euro(expected)}</strong></div></div>${actual===null?'<p class="helper">Minimale verwachte winst, ongeacht welke uitkomst wint.</p>':`<div class="bet-actual-preview">Resultaat bij gekozen winnaar: <b class="${currencyClass(actual)}">${euro(actual)}</b></div>`}`;
}
function openBook(name,checking=false){const existing=data.books.find(b=>E.key(b.name)===E.key(name));if(checking&&!existing)return;const body=`<form id="entry-form" data-kind="${checking?'check':'book'}" data-old="${esc(name||'')}">${checking?`<p class="helper" style="margin-bottom:15px">Vul alleen het <b>werkelijk direct opneembare saldo</b> bij ${esc(name)} in.</p>${field('Echt opneembaar (€)','actual',existing?.actual??'')}`:field('Naam goksite','name',name||'','text','required inputmode="text"')}<p class="form-error" id="form-error"></p></form>`;modal(checking?'Saldocontrole: '+name:name?'Bookmaker wijzigen':'Bookmaker toevoegen',body);}
function openFlow(rec){const edit=!!rec;rec=rec||{date:today(),book:E.allBooks(data)[0],type:'deposit',amount:'',note:''};modal(edit?'Mutatie wijzigen':'Nieuwe storting / opname',`<form id="entry-form" data-kind="flow" data-id="${esc(rec.id||'')}"><div class="formgrid">${field('Datum','date',rec.date||today(),'date')}${formSelect('Bookmaker','book',E.allBooks(data),rec.book)}${formSelect('Soort','type',['deposit','withdrawal'],rec.type)}${field('Bedrag (€)','amount',rec.amount,'text','required')}<div class="span2">${field('Opmerking','note',rec.note,'text','inputmode="text"')}</div></div><p class="form-error" id="form-error"></p></form>`);if(edit)insertDelete();}
function openCasino(rec){const edit=!!rec;rec=rec||{date:today(),book:E.allBooks(data)[0],amount:'',note:''};modal(edit?'Casinowinst wijzigen':'Nieuwe casinowinst',`<form id="entry-form" data-kind="casino" data-id="${esc(rec.id||'')}"><div class="formgrid">${field('Datum','date',rec.date||today(),'date')}${formSelect('Bookmaker','book',E.allBooks(data),rec.book)}${field('Winst / correctie (€)','amount',rec.amount,'text','required')}<div class="span2">${field('Omschrijving','note',rec.note,'text','inputmode="text"')}</div></div><p class="helper" style="margin-top:12px">Negatieve bedragen zijn toegestaan voor correcties, bijvoorbeeld bij een eerder fout ingevoerde bijschrijving.</p><p class="form-error" id="form-error"></p></form>`);if(edit)insertDelete();}
function settleBet(b){const choices=b.type==='2way'?[['1','Bet 1'],['2','Bet 2']]:b.type==='3way'?[['1','Bet 1'],['2','Bet 2'],['3','Bet 3']]:[['1','Bet 1'],['23','Bet 2 + 3']];
 modal('Uitslag: '+b.event,`<form id="entry-form" data-kind="settle" data-id="${esc(b.id)}"><p class="helper" style="margin-bottom:14px">Welke uitkomst heeft gewonnen? De uitbetaling wordt automatisch op de juiste bookmaker bijgeschreven.</p><div class="field"><label>Winnende uitkomst</label><select class="fieldinput" name="winner">${opts(choices.map(x=>x[0]),b.winner==='open'?choices[0][0]:b.winner)}</select></div><div style="margin-top:12px">${field('Afrekendatum','settledDate',today(),'date')}</div><p class="form-error" id="form-error"></p></form>`,'Bet afronden');}
function insertDelete(){const a=overlay.querySelector('.modal-actions');if(a)a.insertAdjacentHTML('afterbegin','<button type="button" class="btn danger" data-action="delete-item" style="margin-right:auto">Verwijderen</button>');}
function closeModal(){overlay.innerHTML='';}
function formError(message){const err=document.getElementById('form-error');if(err)err.textContent=message;}
function saveForm(f){const fd=new FormData(f),g=name=>String(fd.get(name)||'').trim(),kind=f.dataset.kind;
 if(kind==='bet'){
  const type=g('type'),count=type==='2way'?2:3,winner=g('winner');const old=data.bets.find(b=>b.id===f.dataset.id);
  if(!g('event')||!g('date'))return formError('Vul een wedstrijd en datum in.');
  const legs=[];
  for(let i=0;i<count;i++){
   const odd=num(g('odd'+i)),stake=num(g('stake'+i)),freebet=num(g('free'+i)),book=g('book'+i);
   if(!book||odd<=1||stake<0||freebet<0||freebet>stake||stake===0)return formError('Vul voor elke bet een bookmaker, odd > 1 en een inzet > 0 in. Freebet mag niet hoger zijn dan totale inzet.');
   legs.push({book,odd,stake,freebet});
  }
  const valid=type==='2way'?['open','1','2']:type==='3way'?['open','1','2','3']:['open','1','23'];
  if(!valid.includes(winner))return formError('Kies een geldige winnaar voor het type bet.');
  const rec={id:old?.id||id(),createdAt:old?.createdAt||new Date().toISOString(),date:g('date'),event:g('event'),type,legs,winner,settledDate:winner==='open'?'':(g('settledDate')||today())};
  if(old)Object.assign(old,rec);else data.bets.push(rec);
 }else if(kind==='settle'){
  const b=data.bets.find(b=>b.id===f.dataset.id);if(!b)return;
  b.winner=g('winner');b.settledDate=g('settledDate')||today();
 }else if(kind==='book'){
  const name=g('name');if(!name)return formError('Vul een bookmakernaam in.');
  const old=f.dataset.old;if(data.books.some(b=>E.key(b.name)===E.key(name)&&E.key(b.name)!==E.key(old)))return formError('Deze bookmaker bestaat al.');
  if(old){const b=data.books.find(b=>E.key(b.name)===E.key(old));if(!b)return;b.name=name;
   data.bets.forEach(bet=>bet.legs.forEach(l=>{if(E.key(l.book)===E.key(old))l.book=name}));data.flows.forEach(x=>{if(E.key(x.book)===E.key(old))x.book=name});data.casinos.forEach(x=>{if(E.key(x.book)===E.key(old))x.book=name});
  }else data.books.push({id:id(),name,actual:null});
 }else if(kind==='check'){
  const b=data.books.find(x=>E.key(x.name)===E.key(f.dataset.old));if(!b)return;
  b.actual=g('actual')===''?null:E.money(num(g('actual')));
 }else if(kind==='flow'){
  const amount=num(g('amount'));if(amount<=0||!g('book'))return formError('Voer een bedrag groter dan €0 en een bookmaker in.');
  const old=data.flows.find(x=>x.id===f.dataset.id),entry={id:old?.id||id(),date:g('date'),book:g('book'),type:g('type'),amount:E.money(amount),note:g('note')};
  if(old)Object.assign(old,entry);else data.flows.push(entry);
 }else if(kind==='casino'){
  if(g('amount')===''||!g('book'))return formError('Vul een bedrag en bookmaker in.');
  const old=data.casinos.find(x=>x.id===f.dataset.id),entry={id:old?.id||id(),date:g('date'),book:g('book'),amount:E.money(num(g('amount'))),note:g('note')};
  if(old)Object.assign(old,entry);else data.casinos.push(entry);
 }
 persist();closeModal();render();if(view==='calculator')recalc();
}
function backUp(){const file='surebet-backup-'+today()+'.json';const content=JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2);const blob=new Blob([content],{type:'application/json'});
 if(navigator.canShare&&navigator.share){const f=new File([blob],file,{type:'application/json'});if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Surebet back-up'}).catch(()=>{});return;}}
 const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=file;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);
}
async function restore(file){if(!file)return;try{const incoming=JSON.parse(await file.text());if(!validState(incoming))throw Error('Dit is geen geldig Surebet back-upbestand.');if(!confirm('Je huidige gegevens vervangen door deze back-up? Maak zo nodig eerst een back-up van de huidige versie.'))return;data={version:2,books:incoming.books,bets:incoming.bets,flows:incoming.flows,casinos:incoming.casinos};persist();goto('dashboard');alert('Back-up hersteld.');}catch(e){alert('Importeren mislukt: '+e.message)}}
function showMore(){menuOpen=!menuOpen;shell()}
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-nav]');if(nav){goto(nav.dataset.nav);return}
 const action=e.target.closest('[data-action]');if(!action)return;const a=action.dataset.action,recordId=action.dataset.id;
 switch(a){case 'more':showMore();break;
 case 'new-bet':openBet(null);break;case 'edit-bet':openBet(data.bets.find(b=>b.id===recordId));break;case 'settle-bet':settleBet(data.bets.find(b=>b.id===recordId));break;
 case 'new-book':openBook('');break;case 'edit-book':openBook(action.dataset.name);break;case 'check-book':openBook(action.dataset.name,true);break;
 case 'new-flow':openFlow(null);break;case 'edit-flow':openFlow(data.flows.find(x=>x.id===recordId));break;
 case 'new-casino':openCasino(null);break;case 'edit-casino':openCasino(data.casinos.find(x=>x.id===recordId));break;
 case 'close-modal':closeModal();break;
 case 'delete-item':{const f=document.getElementById('entry-form');if(!f)return;const k=f.dataset.kind,idv=f.dataset.id,arr=k==='bet'?'bets':k==='flow'?'flows':k==='casino'?'casinos':null;if(arr&&confirm('Deze registratie definitief verwijderen?')){data[arr]=data[arr].filter(x=>x.id!==idv);persist();closeModal();render()}break;}
 case 'backup':backUp();break;case 'restore':document.getElementById('restore-file').click();break;case 'show-bets':goto('bets');break;
 }
});
// Prevent losing records by allowing delete from within edit dialogs.
document.addEventListener('click',e=>{if(e.target.id==='modal-overlay'&&!document.querySelector('#entry-form[data-kind="bet"]'))closeModal()});
document.addEventListener('submit',e=>{if(e.target.id==='entry-form'){e.preventDefault();saveForm(e.target)}});
document.addEventListener('change',e=>{
 if(e.target.name==='type'&&e.target.closest('#entry-form'))fixWinOptions();
 else if(e.target.closest('#entry-form')?.dataset.kind==='bet')updateBetPreview();
 if(e.target.id==='bet-filter'){filter=e.target.value==='Open'?'open':e.target.value==='Afgerond'?'closed':'all';render()}
 if(e.target.id==='bet-sort'){sort=e.target.value==='Oudste eerst'?'oldest':'newest';render()}
 if(e.target.id==='calc-type'||e.target.id==='calc-round')recalc();
 if(e.target.id==='restore-file'){restore(e.target.files[0]);e.target.value=''}
});
document.addEventListener('input',e=>{
 if(e.target.id==='bet-search'){search=e.target.value;const pos=e.target.selectionStart;render();const input=document.getElementById('bet-search');input.focus();input.setSelectionRange(pos,pos);}
 if(e.target.classList.contains('calc-input')||e.target.id==='calc-budget')recalc();
 if(e.target.closest('#entry-form')?.dataset.kind==='bet')updateBetPreview();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('storage',e=>{if(e.key===STORAGE&&e.newValue){try{const d=JSON.parse(e.newValue);if(validState(d)){data=d;render()}}catch(_){}}});
render();if(view==='calculator')recalc();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
